<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>

    
</head>
<body>
    <h1>Iframe Tab</h1>

    <h3>An iframe <mark>(iframe)</mark> is used to embed another webpage, video, map, or document inside the current webpage.</h3>

    <iframe width="600" height="350" src="https://www.youtube.com/embed/JHJmFbLeK-Y?si=7FJFDQJCgFMMC0kK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> <br><br>

    <iframe width="600" height="350" src="https://www.youtube.com/embed/qi2rByJed-E?si=BsIFoHfJBt1GG1f9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <h2>Important Points:</h2>

    <ul>
        <li>Embeds external content.</li>
        <li>Can display websites, videos, maps, etc.</li>
        <li>Uses src attribute for the URL.</li>
        <li>Width and height control the size.</li>
    </ul>



</body>
</html>
