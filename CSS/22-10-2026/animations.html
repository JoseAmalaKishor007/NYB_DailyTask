<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="animations.css" />
  </head>
  <body>
    <div id="container">
      <div id="textShadow">
        <h1>Text Shadow</h1>
      </div>

      <div id="boxShadow">
        <div class="box1"></div>
        <div class="box2"></div>
      </div>

      <div id="opacity">
        <h1 class="opacity1">This is Opacity of 90%</h1>
        <h1 class="opacity2">This is Opacity of 20%</h1>
        <h1 class="opacity3">This is Opacity of 0%</h1>
        <img
          class="opacityImg"
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmE-K8diKwWdJJsyPSfcyyLZoEm8PkXAYdb2T3uyk3Xw&s=10"
          alt="Image"
        />
      </div>

      <div id="transition">
        <div class="transition1"></div>
        <div class="transition2"></div>
      </div>

      <div id="transform">
        <h2>Translate</h2>
        <div class="box translate"></div>

        <h2>Rotate</h2>
        <div class="box rotate"></div>

        <h2>Scale</h2>
        <div class="box scale"></div>

        <h2>Skew</h2>
        <div class="box skew"></div>
      </div>



      <h1>CSS Animation Example</h1>

    <div class="anime">Animate Me!</div>











































    </div>
  </body>
</html>
